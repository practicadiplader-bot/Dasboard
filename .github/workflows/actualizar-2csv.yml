name: Actualizar 2.csv cada 12 horas

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar extractor
        run: python extractor_2csv.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 2.csv
          if git diff --staged --quiet; then
            echo "⏭️  Sin cambios en 2.csv"
          else
            git commit -m "Actualizar 2.csv — $(date -Iseconds)"
            git push
            echo "✅ 2.csv actualizado"
          fi
